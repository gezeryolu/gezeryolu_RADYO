name: Gezeryolu Haber Guncelle
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutuphaneleri Yukle
        run: pip install edge-tts requests

      - name: Botu Calistir (Sert Yontem)
        run: |
          # Bulundugun yerdeki her seyi listele (Hata ayiklamak icin)
          ls -R
          # bot.py dosyasini nerede olursa olsun bul ve calistir
          find . -name "bot.py" -exec python3 {} \;

      - name: MP3u Kaydet
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Haber bulteni guncellendi"
          file_pattern: "haberler.mp3"
